plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // 本地 Fabric maven 镜像（离线优先）
    maven { url = uri('file:///D:/dev/fabric-maven-mirror') }
    // 国内加速镜像（按顺序尝试，缺文件自动落到下一个源）
    maven { url = 'https://bmclapi2.bangbang93.com/maven' }  // BMCLAPI 镜像
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "autotranslate" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu（仅编译期依赖，运行时可选：装了 Mod Menu 才有配置界面，不装不影响功能）
    compileOnly files("libs/modmenu-21.0.0.jar")

    // Cloth Config（配置界面库：滚动/分类/下拉/重置；LGPL-3.0 动态链接，不打包进 jar，
    // 运行时从 mods 加载（fabric.mod.json depends），jar 为成品映射版无需 remap）
    compileOnly files("libs/cloth-config-fabric-26.3.159.jar")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from("LICENSE_CFPA") {
        rename { "LICENSE_CFPA" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
